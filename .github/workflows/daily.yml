name: Daily SEO and GEO check

on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST every day
  workflow_dispatch: {}

permissions:
  contents: write          # only to commit data/ back to this private repo

concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily audit and fixes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python run_daily.py
      - name: Save results
        run: |
          git config user.name "staplerlabs-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily run $(date -u +%F)"
          git pull --rebase --quiet && git push --quiet
