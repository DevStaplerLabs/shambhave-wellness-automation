name: Weekly SEO and GEO report

on:
  schedule:
    - cron: "41 2 * * 1"   # Monday 08:11 IST, after the daily run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python run_weekly.py
      - name: Save results
        run: |
          git config user.name "staplerlabs-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: weekly report $(date -u +%F)"
          git pull --rebase --quiet && git push --quiet
